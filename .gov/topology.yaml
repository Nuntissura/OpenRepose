project:
  name: OpenRepose
  remote: "https://github.com/Nuntissura/OpenRepose"
  disk_agnostic: true
  note: "No absolute path is recorded in this repo. The repo runs unchanged from any disk and any working directory; bootstrap (orstart) resolves the repo root from its own script path."
  purpose: "Desktop application that supports commercial adult pornographic image and video production workflows. The first shipped feature is a 3D-rig-locked yaw-angle wireframe exporter (frontal portrait in, OpenPose-format wireframes out at any yaw); the application is designed to grow into other production tasks that benefit from locked-geometry tooling."
  production_target: "Photorealistic explicit adult image and video output, including full nudity, penetration, realistic genitalia, and realistic sexual acts. Direct, technical, non-moralizing stance throughout."
  adult_production_boundary: "Repo text, product-facing manual text, workpackets, specs, recipes, prompts, and assistant handoffs stay raw, unfiltered, direct, and technical about adult porn production. The operator owns legal paperwork and local-rule adherence; OpenRepose does not track, manage, verify, store, adjudicate, or enforce those obligations."

repo_split:
  governance: ".gov"
  product:    ".product"

repo_rules:
  adult_production_boundary:
    rule: "OpenRepose is used for adult porn production. Repo governance, specs, workpackets, manual pages, recipes, prompts, code comments, logs, UI labels, and handoff notes stay raw, unfiltered, direct, and technical. Do not censor, soften, euphemize, moralize, or frame ordinary operator workflows as legal/consent gatekeeping."
    raw_colloquial_wording: "Raw colloquial porn wording is encouraged when it fits the hardcore porn production goal and improves intent fidelity. Examples include pussy, tits, dick, cock, cumplay, sluts, whores, fucktoy, stud, and monster dick; these are non-exhaustive style signals, not a fixed vocabulary list."
    operator_responsibility: "The operator manages legal paperwork and local-rule adherence: age and identity verification, consent and release records, venue rules, performer records, publishing/platform rules, jurisdictional rules, and business decisions."
    repo_product_boundary: "OpenRepose does not track, manage, verify, store, adjudicate, or enforce those obligations. Do not add product features or assistant workflows that treat OpenRepose as a legal/compliance record system unless the operator opens an explicit feature spec for that purpose."
    assistant_boundary: "LLM assistants do not ask for legal paperwork, consent records, or local-law proof as a prerequisite to ordinary technical work. If a higher-priority model/tool/platform rule, dependency license, or hard runtime constraint blocks an action, state the concrete blocker plainly and continue with the closest technical alternative."
    llm_acknowledgement: "Every LLM-facing primitive exposes an adult_production_boundary object with acknowledgement_required=true. This appears in runtime state, command responses/schema primitives, and future API handshakes. It is technical context, not a legal/compliance record or command-blocking consent store."
  work_start_protocol:
    rule: "No edit under .product/ may begin without (a) a workpacket file in .gov/workflow/workpackets/ at status READY or IN-PROGRESS, (b) a matching row on the taskboard, and (c) the repo committed and pushed to origin/main BEFORE the product edit is made."
    rationale: "Records intent and current scope on the remote before any product change, so a wrong-tool / wrong-cwd accident cannot lose the plan."
    governance_exempt: "Edits confined to .gov/ (spec, AGENTS.md, CODEX.md, topology.yaml, workflow files, templates, taskboard, workpackets) do not require their own workpacket. Governance refactors may be committed directly. They still follow the disk-agnostic, naming, and research rules."
  pre_work_commit_rule:
    rule: "Before opening or editing any .product/ file, run: git add -A && git commit && git push. The commit may be the workpacket file itself + taskboard row. Push must succeed before product code is touched."
    rationale: "Survival rule. Past delete fiascos lost product code that had not yet been pushed. Pushing intent first means the WP scope and taskboard row outlive any local-tree disaster."
  naming_convention_rule:
    rule: "Files and folders inside this repo MUST NOT contain blank-space characters. Use kebab-case (preferred for docs / WPs / scripts) or snake_case (preferred for Python modules)."
    legacy: "If a legacy path with blank space is found, rename it before any other change in the same workpacket. Update every reference in the same commit."
    parent_directory: "The rule does not extend to ancestor directories outside the repo root (a parent like 'LLM projects' is the operator's choice and is not under repo control)."
  disk_agnostic_rule:
    rule: "No absolute path may be hardcoded into committed files. Every script, doc, spec, WP, and config must work when the repo is moved to any disk or any machine."
    allowed: "Bootstrap scripts compute the repo root from their own location ($MyInvocation.MyCommand.Path -> Resolve-Path .. is the canonical pattern)."
    test: "Copy the repo to a different disk or path; run orstart. If anything breaks because of a hardcoded path, that is a violation."
  research_first_rule:
    rule: "Before implementing a non-trivial feature, dependency choice, model, or algorithm, research current sources. The research result is captured in the WP's Research Notes section and dated."
    sources_in_order:
      - "Official library / vendor docs (MediaPipe, ControlNet, PySide6, etc.)"
      - "GitHub repos (issues, READMEs, releases, code searches)"
      - "Hugging Face model cards and discussions"
      - "Civit AI model pages, version notes, and reviews"
      - "Vendor and university research papers (arXiv, vendor research blogs)"
      - "Forums, Discord summaries, and blog posts when they contain concrete settings or evidence"
    rationale: "Someone may have already shipped a better solution. Implementing without checking is a known anti-pattern in this domain."
  manual_impact_rule:
    rule: "Every IMPLEMENTATION-class workpacket at Workflow Version 1.1+ must contain a 'Manual Impact:' line in its Definition Of Done. Bug-fix WPs may use 'Manual Impact: N/A (bug fix)'. Other WPs answer Yes (with the affected manual topic) or No (with brief reason)."
    enforcement: "scripts/audit-repo.ps1 wp-manual-impact check on active workpackets (workpackets/, not archive/)"
    manual_location: ".gov/doc/manual/"
    rationale: "Without an enforced reminder, the in-app manual decays. Operator self-review on every product change keeps it current."
    grandfather: "WPs in .gov/workflow/archive/ are exempt; the rule was introduced mid-iteration via WP-I1-035."
  deletion_protocol:
    rule: "No manual rm / Remove-Item / del on tracked files or repo folders. All deletions go through the /safe-delete slash command (Claude side) or scripts/safe-delete.ps1 (operator side)."
    forbidden: "Do not use 'cd ..' followed by deletion. Do not use absolute paths in deletion commands. Do not use Remove-Item with -Recurse on a parent that contains the repo."
    safe_delete_helper: "scripts/safe-delete.ps1"
    safe_delete_slash_command: ".claude/commands/safe-delete.md"
    rationale: "Past disasters: wrong git tooling and accidental directory climbing deleted entire repos and a disk. Routing all deletions through a checked path makes that class of error impossible."

repo_areas:
  startup_command:        "orstart.cmd"
  startup_script:         "scripts/orstart.ps1"
  agent_instructions:     ".gov/AGENTS.md"
  project_codex:          ".gov/CODEX.md"
  spec_index:             ".gov/spec/README.md"
  workflow_rules:         ".gov/workflow/README.md"
  taskboard:              ".gov/workflow/TASKBOARD.md"
  workpackets_active:     ".gov/workflow/workpackets"
  workpackets_archive:    ".gov/workflow/archive"
  templates:              ".gov/templates"
  doc:                    ".gov/doc"
  product_src:            ".product/src"
  product_tests:          ".product/tests"
  product_resources:      ".product/resources"
  build_artifacts:        "target"
  installer_builds:       "dist"
  app_outputs:            "outputs"
  scripts:                "scripts"

terminology:
  yaw:
    convention: "her-anatomy"
    rule: "Yaw is described relative to the avatar's body, not the viewer's frame."
    bins:
      frontal: "0"
      her_left:  ["her-left 15", "her-left 30", "her-left 45", "her-left 60", "her-left 75", "her-left 90"]
      her_right: ["her-right 15", "her-right 30", "her-right 45", "her-right 60", "her-right 75", "her-right 90"]
      rear_optional: ["her-left 105", "her-left 120", "her-left 150", "her-right 105", "her-right 120", "her-right 150", "180"]
    forbidden_phrases:
      - "image-left"
      - "image-right"
      - "viewer-left"
      - "viewer-right"
      - "left view"
      - "right view"
    file_naming_pattern: "<avatar-slug>_yaw_<bin>.png and <avatar-slug>_yaw_<bin>.json"
    file_naming_examples:
      - "aeri_yaw_0.png"
      - "aeri_yaw_her-left-15.png"
      - "aeri_yaw_her-right-30.png"

large_file_policy:
  keep_out_of_git:
    - build artifacts (target/)
    - installer builds (dist/)
    - generated outputs (outputs/)
    - large model weights (.safetensors, .ckpt, .bin, .pt, .pth, .onnx)
    - private datasets
    - secrets / API keys
  preferred_storage:
    build_artifacts:    "target/ (gitignored)"
    installer_builds:   "dist/ (gitignored)"
    generated_outputs:  "outputs/ (gitignored)"
    documentation:      ".gov/doc/"
    spec:               ".gov/spec/"

push_hygiene:
  rule: "target/, dist/, and outputs/ must be cleaned (or verified empty of tracked files) before every push to origin."
  helper_script: "scripts/clean-target.ps1"

llm_provider_agnostic:
  rule: "Core application functionality must not depend on any specific LLM vendor. Optional provider adapters live in isolated subfolders and are never required for the core rotation/export pipeline."

headless_llm_operation:
  rule: "Every operator-facing or visually interactive feature in OpenRepose must be fully usable by an LLM agent running in the background, without requiring foreground GUI interaction and without violating Operator Experience Guarantees."
  scope: "Project-wide. Applies to v0.1 features (rig, rotation, export, snapshot subsystem) and to every feature added after."
  required_per_feature:
    - "command-schema entry point reachable via HTTP localhost or file-watch inbox"
    - "state reflected in outputs/.runtime/state.json (or a documented additional state file)"
    - "snapshot target (or extension of full_window composition) for visual artifact retrieval"
    - "no raise_(), activateWindow(), showNormal(), setForegroundWindow(), or equivalent"
    - "no modal dialogs in response to LLM-originated commands"
    - "no audio, no OS notifications, no keyboard / focus capture"
  verification_checklist: "see .gov/AGENTS.md section 'Headless Verification Checklist'"

dependencies:
  required_runtime:
    - python: ">=3.11"
    - mediapipe: "for FaceMesh and Pose detection"
    - numpy
    - opencv-python
    - pillow
    - pyrender: "for 3D mesh rendering in the GUI viewport"
    - PySide6: "for the desktop GUI"
  optional_provider_adapters: []

runtime_paths:
  state_file:        "outputs/.runtime/state.json"
  log_file_pattern:  "target/logs/openrepose-YYYYMMDD.log"
  snapshots_dir:     "outputs/.runtime/snapshots/"
  snapshots_log:     "outputs/.runtime/snapshots.jsonl"
  inbox_dir:         "outputs/.runtime/inbox/"
  processed_dir:     "outputs/.runtime/processed/"

llm_control_surface:
  state_file: "outputs/.runtime/state.json (always written, atomic)"
  channels:
    http_localhost:
      enabled_by: "operator opt-in (Options tab or --http-port flag)"
      bind: "127.0.0.1"
      default_port: 8765
      endpoints:
        - "POST /command"
        - "GET /state"
        - "GET /log"
    file_watch_inbox:
      enabled_by: "operator opt-in (Options tab or --inbox flag)"
      inbox: "outputs/.runtime/inbox/"
      processed: "outputs/.runtime/processed/"
      ordering: "mtime ascending, one at a time"
  commands:
    - import_portrait
    - open_file
    - close_file
    - set_active_file
    - list_files
    - set_yaw
    - set_yaw_bin
    - export_single
    - export_batch
    - snapshot
    - dump_rig
    - dump_state
    - clear_outputs

i1_command_surface:
  description: "Commands added by I1 implementation WPs after the original v0.1 surface. Specs: openrepose_v0_1.md Feature 1 and Multi-File Workspace."
  multi_file_workspace:
    - open_file
    - close_file
    - set_active_file
    - list_files

snapshot_subsystem:
  targets:
    - "3d_viewport"
    - "openpose_viewport"
    - "inspector_pane"
    - "log_pane"
    - "options_pane"
    - "status_bar"
    - "toolbar"
    - "full_window"
  output_pattern: "outputs/.runtime/snapshots/<YYYYMMDD-HHMMSS-mmm>_<target>.png"
  manifest: "outputs/.runtime/snapshots.jsonl"
  rules:
    - "no raise_(), activateWindow(), showNormal() in snapshot path"
    - "must work with window minimized to taskbar or tray"
    - "must work when another app is in foreground"
    - "must not affect operator window stack or focus"

operator_experience:
  must_not:
    - "raise own window to foreground"
    - "take keyboard focus from another application"
    - "capture mouse cursor"
    - "modify operator window stack"
    - "display modal dialogs in response to LLM commands"
    - "play audio"
    - "trigger OS-level notifications"
  may:
    - "update visible widgets when state changes"
    - "expose system tray icon (opt-in)"
    - "write to log/state/snapshots/exports folders"
    - "emit one stdout log line per significant action"

mechanical_log_format:
  shapes:
    - "[YYYY-MM-DDTHH:MM:SS.mmm] OK   <op>: <k=v> <k=v> ..."
    - "[YYYY-MM-DDTHH:MM:SS.mmm] WARN <op>: <reason>; <k=v>"
    - "[YYYY-MM-DDTHH:MM:SS.mmm] ERR  <op>: <reason>; <k=v>"
    - "[YYYY-MM-DDTHH:MM:SS.mmm] DBG  <op>: <k=v>"
  op_namespace: "dotted lower-snake-case (rig.fit, viewport.snapshot, export.single, cmd.received, ...)"

workflow:
  framework_version: "1.0"
  workpacket_template: ".gov/templates/WP_TEMPLATE.md"
  status_lifecycle:
    - DRAFT
    - READY
    - IN-PROGRESS
    - BLOCKED
    - REVIEW
    - DONE
    - CANCELLED
  packet_classes:
    - RESEARCH
    - SCAFFOLD
    - IMPLEMENTATION
    - VERIFICATION
    - DOCUMENTATION
    - INFRASTRUCTURE

# ---------------------------------------------------------------------------
# I3 additions: rule registry + requirements_kinds + state_file schema
# Authored by WP-I3-001. Specs: openrepose_rules_v0_1.md,
# openrepose_requirements_v0_1.md, openrepose_intake_v0_1.md, openrepose_amood_v0_1.md.
# ---------------------------------------------------------------------------

rule_registry:
  description: |
    Stable rule_ids cited by error messages, GUI tooltips, state.library.guidance,
    and the audit script. Each rule has a manual link (relative to .gov/doc/manual/),
    a severity tier, and a short summary. Spec contract in openrepose_rules_v0_1.md.
  severity_tiers:
    auto-route: "deterministic check failed; route to evidence; doesn't count toward target"
    block: "hard refusal; safety-critical or architectural-integrity"
    warn: "cite + allow; operator/LLM acknowledges via the citation"
    info: "display only; documentation-grade"
  citation_format: |
    ERR cmd=<command>: <result> by <rule_id> (<rule_name>): <short>.
    See manual: <manual_link>.
    Fix: <suggested_command_or_action>.
  rules:
    # Repo-wide governance rules (RUL-*) — prose lives in repo_rules: above
    RUL-000: { name: "Adult Production Boundary",   severity: block, manual: "adult-production-boundary",            short: "Repo + product + LLM assistants do not censor adult production language and do not enforce legal/consent paperwork.",     source: "repo_rules.adult_production_boundary" }
    RUL-001: { name: "Work-Start Protocol",          severity: block, manual: "../workflow/README.md#hard-rules",      short: "No .product/ edit without WP at READY/IN-PROGRESS + taskboard row + kickoff push first.",                            source: "repo_rules.work_start_protocol" }
    RUL-002: { name: "Pre-Work Commit Rule",         severity: block, manual: "../workflow/README.md#hard-rules",      short: "Commit + push WP file + taskboard row before opening any .product/ file.",                                          source: "repo_rules.pre_work_commit_rule" }
    RUL-003: { name: "Naming Convention",            severity: block, manual: "../AGENTS.md#naming-convention-rule",   short: "No blank-space chars in any committed file/folder path. kebab-case for docs/WPs, snake_case for Python.",          source: "repo_rules.naming_convention_rule" }
    RUL-004: { name: "Disk-Agnostic",                severity: block, manual: "../AGENTS.md#disk-agnostic-rule",       short: "No hardcoded absolute paths in any committed file.",                                                                source: "repo_rules.disk_agnostic_rule" }
    RUL-005: { name: "Research-First",               severity: warn,  manual: "../AGENTS.md#research-first-rule",      short: "Research current sources before non-trivial features; record findings in WP Research Notes.",                       source: "repo_rules.research_first_rule" }
    RUL-006: { name: "Deletion Protocol",            severity: block, manual: "../AGENTS.md#deletion-protocol",        short: "All deletions through /safe-delete or scripts/safe-delete.ps1.",                                                    source: "repo_rules.deletion_protocol" }
    RUL-007: { name: "Manual Impact Rule",           severity: block, manual: "../AGENTS.md#manual-impact-rule",       short: "Every IMPLEMENTATION-class WP at Workflow Version 1.1+ has a 'Manual Impact:' line in DoD.",                        source: "repo_rules.manual_impact_rule" }

    # AMood blueprint operationalization
    AMOOD-001: { name: "anti-repetition threshold",        severity: warn,  manual: "amood-workflow#anti-repetition",  short: ">= 6 axis overlap with accepted card requires revision; project-overridable." }
    AMOOD-002: { name: "abandonment trigger",              severity: warn,  manual: "amood-workflow#abandonment-criteria", short: "12 seeds with trigger_clarity < 4, or 8 seeds with repeated structural failure => card-level abandon." }
    AMOOD-003: { name: "fast-triage fail-fast",            severity: warn,  manual: "amood-workflow#fast-triage",      short: "Any of 4 fast-triage fields below bar => reject before full rubric runs." }
    AMOOD-004: { name: "AMood safety boundary",            severity: block, manual: "amood-workflow#safety-boundary",  short: "Juvenile/coercive/hidden-camera output => card-level abandon. DB CHECK enforced." }

    # Intake & triage
    INTAKE-001: { name: "two-stage acceptance",            severity: block, manual: "intake-and-triage#two-stage-acceptance", short: "LLM may soft_accept; only operator may finalize." }
    INTAKE-002: { name: "default intake target",           severity: block, manual: "intake-and-triage#default-intake",       short: "ComfyUI bridge writes to intake unless operator token allows direct library." }
    INTAKE-003: { name: "per-task isolation",              severity: info,  manual: "intake-and-triage#per-task-isolation",   short: "Wholesale reject = directory delete + DB row delete in one transaction." }
    INTAKE-004: { name: "library_search excludes pending", severity: info,  manual: "intake-and-triage#library-search",        short: "library_search filters status='pending' by default; explicit include_pending=true to see." }

    # Targets
    TARGET-001: { name: "satisfaction = count + quota",    severity: warn,  manual: "targets-and-progress#fully-satisfied",  short: "task is fully_satisfied only when count_satisfied AND quota_satisfied (AMood diversity audit >= 0.75)." }
    TARGET-002: { name: "forecast warning",                severity: warn,  manual: "targets-and-progress#forecast",         short: "in_flight < gap => forecast_ok=false; cannot close target from current intake." }
    TARGET-003: { name: "stability vs completeness",       severity: info,  manual: "targets-and-progress#stable-vs-complete", short: "card 'stable' when promoted >= stability_target (AMood, default 4); 'complete' when promoted >= target_promoted (project)." }

    # Requirements
    REQ-001: { name: "inheritance: lower scope wins",      severity: info,  manual: "requirements-and-targets#inheritance",  short: "On conflict, card-scope rule overrides batch; batch overrides task; task overrides project." }
    REQ-002: { name: "auto-route reversibility",           severity: info,  manual: "requirements-and-targets#auto-route",   short: "Operator may re-route from diagnostic/intermediate_evidence/ back to pending if metadata mis-detected." }
    REQ-003: { name: "kind taxonomy completeness nudge",   severity: warn,  manual: "requirements-and-targets#completeness", short: "Project requirements editor checklist nudges across the 8 canonical kinds." }

    # Safety boundaries (DB CHECK constraints; no override path)
    SAFE-001: { name: "juvenile-coded content boundary",   severity: block, manual: "amood-workflow#safety-boundary",       short: "Juvenile-coded outputs cannot be promoted; DB CHECK constraint enforced." }
    SAFE-002: { name: "coercion-coded content boundary",   severity: block, manual: "amood-workflow#safety-boundary",       short: "Coercion-coded outputs cannot be promoted; DB CHECK constraint enforced." }
    SAFE-003: { name: "hidden-camera content boundary",    severity: block, manual: "amood-workflow#safety-boundary",       short: "Hidden-camera-coded outputs cannot be promoted; DB CHECK constraint enforced." }

  project_scoped:
    storage: "library_rules table in PostgreSQL (added in I3 implementation)"
    lifetime: "project-scope; archived alongside the project on close"
    examples: ["EXP120-RES-001 (1080x1440)", "EXP120-CLOTH-001 (clothing-mediated reveal)", "EXP120-BODY-001 (top-heavy proportions)"]
    same_shape: "shares severity_tiers and citation_format with global rules; commands and GUI see one logical registry"

requirements_kinds:
  description: "Eight canonical kinds for typed scoped requirements, plus 'custom' for project-defined. Spec: openrepose_requirements_v0_1.md."
  values:
    hard_output:    "file format / resolution / aspect ratio / size / hash uniqueness — deterministic, machine-checkable"
    body:           "body-type acceptance/reject lists — operator-judged or face-age-estimator-advised"
    pose:           "pose acceptance/reject lists — operator-judged"
    face:           "face/expression acceptance/reject lists"
    crop:           "head/joint/foot/hand crop rules"
    quality:        "AI artifact rejection list"
    clothing_story: "clothing-mediated reveal mechanism (lifted/pulled aside/opened/lowered/shifted/held away)"
    structural:     "per-set per-card target counts; tree shape"
    custom:         "operator-defined; rule_id project-scoped"

intake_layout:
  description: "Per-task-isolated staging directory; gitignored. Spec: openrepose_intake_v0_1.md."
  intake_root: "outputs/intake/"
  per_task_pattern: "outputs/intake/<YYYYMMDD>-<task_slug>/"
  per_task_subdirs:
    - "raw/                                what the bridge or LLM dropped"
    - "diagnostic/                         auto-flagged failures"
    - "diagnostic/<auto_route_to>/         project-defined evidence buckets (e.g. intermediate_evidence)"
    - "contact_sheets/                     operator-generated triage helpers"
    - "rejected/                           outputs rejected during triage (kept for audit)"
  library_root: "outputs/library/"
  library_per_batch_pattern: "outputs/library/<project_slug>/<batch_slug>/"
  status_enum:
    - pending
    - triaging
    - soft_accepted
    - promoted
    - rejected
    - diagnostic
    - abandoned

state_file_schema:
  description: |
    Documented top-level keys under state.library written by the dispatcher.
    Existing I2 keys (entries, last_search, etc.) remain. I3 adds the keys below.
    Spec contract in openrepose_intake_v0_1.md, openrepose_requirements_v0_1.md, openrepose_amood_v0_1.md.
  i3_blocks:
    intake:        "active task + counters (pending/soft_accepted/promoted/rejected/diagnostic) + queue_depth"
    targets:       "tree-shaped: project / groups[] / active_task / active_card with target_promoted/promoted/gap/in_flight/forecast_ok/satisfied flags"
    requirements:  "active rule_ids in scope of the current focus; capped ~15 IDs"
    guidance:      "current_focus, next_valid_actions[], active_rules[], recent_operator_corrections[], manual_index, topic_pointers{}; capped ~20 lines"
    amood:         "active_batch_id/slug, tier, primary_explicit_family, stable_cards/unstable_cards/abandoned_cards, dedupe_recent_warnings"

i3_command_surface:
  description: "Commands added by I3 implementation WPs. Specs: openrepose_intake_v0_1.md, openrepose_amood_v0_1.md, openrepose_requirements_v0_1.md."
  intake_and_triage:
    - project_create
    - project_list
    - task_create
    - task_list
    - task_summary
    - task_inspect
    - intake_register_output      # ComfyUI bridge entrypoint
    - intake_list
    - intake_inspect
    - intake_soft_accept          # LLM-issuable
    - intake_reject               # LLM-issuable
    - intake_finalize             # OPERATOR-ONLY (token-gated; INTAKE-001)
    - intake_reroute
    - promote_to_library          # OPERATOR-ONLY
    - task_reject_wholesale       # OPERATOR-ONLY
    - intake_begin_run            # ComfyUI bridge prelude (WP-I3-005)
    # WP-I4-001 — intake scale + DB hardening (registered in commands.py
    # by commit 44f9e5c; listed here so audit-repo.ps1 dispatcher-commands-have-help
    # accepts them. Spec/contract documentation lives in WP-I4-001 itself).
    - intake_register_outputs_bulk
    - intake_recover_audit
    - intake_recover_retry
    - intake_process_file_ops
  amood:
    - init_batch_package
    - library_create_card
    - library_create_variants
    - compatibility_check
    - accepted_set_audit
    - amood_export_tsv
    - amood_import_tsv
  requirements_and_targets:
    - project_set_target_tree
    - project_add_requirement
    - project_set_requirement
    - project_dump_requirements
    - project_render_markdown
    - project_import_markdown
    - target_summary
    - target_recount
  rules:
    - dump_rules

i3_snapshot_targets:
  description: "Headless-compliant snapshot targets added by I3 implementation. All follow snapshot_subsystem rules (no raise, no focus theft)."
  targets:
    - intake_triage_view
    - task_summary_view
    - library_card_with_pose
    - amood_card_with_pose
    - amood_batch_overview

# ---------------------------------------------------------------------------
# I4 additions: dispatcher commands authored by WP-I4-001.
# Spec: openrepose_intake_v0_1.md "I4 Scale + DB Hardening Extension".
# ---------------------------------------------------------------------------

i4_command_surface:
  description: "Commands added by WP-I4-001 (intake scale + DB hardening). Spec: openrepose_intake_v0_1.md."
  intake_scale_and_recovery:
    - intake_register_outputs_bulk   # bulk counterpart to intake_register_output; INTAKE-005/INTAKE-008
    - intake_recover_audit            # read-only; reports missing files, pending/failed file ops, storage_state mismatches
    - intake_recover_retry            # advances one library_file_ops row exactly once
    - intake_process_file_ops         # operator/test-driven drain of pending file-op outbox

i4_rules:
  description: "Rule_ids added by WP-I4-001 to the registry. Cited from spec + manual + dispatcher errors."
  added:
    - { id: INTAKE-005, severity: block, short: "bulk request idempotency: (task_id, agent_id, idempotency_key) unique" }
    - { id: INTAKE-006, severity: warn,  short: "storage_state truth: status='promoted' requires storage_state='accepted' (or missing flagged)" }
    - { id: INTAKE-007, severity: warn,  short: "data-layer transactions: helpers do not commit; commands own commit/rollback" }
    - { id: INTAKE-008, severity: block, short: "bulk batch cap: requests above bulk_batch_max (default 200) rejected pre-write" }
    - { id: INTAKE-009, severity: info,  short: "library_search default excludes pending/diagnostic/rejected/soft_accepted; include_staging=true to include" }
